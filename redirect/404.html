<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- This site moved. What used to be here, the newsletter digests and the
         tool links, lives at no-brainer now, together with the podcast and the
         tools running on the same origin.

         Three redirects, on purpose, because each covers a case the others do
         not:

         canonical   tells search engines which URL is the real one, so the new
                     site inherits the ranking instead of competing with a copy
         http-equiv  moves a reader with JavaScript turned off
         script      moves everyone else immediately, before the meta fires

         And a visible link under all of it, for the case where every one of
         them is blocked. A page that says nothing while failing to redirect is
         a dead end. -->
    <link rel="canonical" href="https://no-brainer-news.web.app/" />
    <meta http-equiv="refresh" content="0; url=https://no-brainer-news.web.app/" />
    <meta name="robots" content="noindex, follow" />

    <title>Mudamos para no-brainer</title>

    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        line-height: 1.6;
        text-align: center;
        background: #0f0f0f;
        color: #e4e4e4;
      }

      @media (prefers-color-scheme: light) {
        body {
          background: #f0eee9;
          color: #1a1a1a;
        }
      }

      p {
        margin: 0 0 1.5rem;
        max-width: 34ch;
        font-size: 0.9375rem;
        opacity: 0.75;
      }

      a {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        font-weight: 700;
        color: inherit;
        text-decoration: none;
        border: 1px solid currentColor;
        border-radius: 999px;
      }
    </style>
  </head>

  <body>
    <main>
      <p>Este site virou o no-brainer. Se nada acontecer em um segundo, o link abaixo leva lá.</p>
      <a href="https://no-brainer-news.web.app/">Ir para o no-brainer</a>
    </main>

    <script>
      // replace, not assign: the old URL does not stay in the history, so Back
      // from the new site goes where the reader actually came from instead of
      // bouncing them through this page again.
      location.replace('https://no-brainer-news.web.app/')
    </script>
  </body>
</html>
